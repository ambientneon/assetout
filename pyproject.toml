[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assetout"
version = "0.1.0"
description = "Keep large binary assets out of Git — store them in GitHub Releases"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "ambientneon" }  # поменяй на себя
]
keywords = ["git", "binaries", "assets", "github-releases", "lfs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "xxhash>=3.0",
]

[project.urls]
Homepage = "https://github.com/ambientneon/assetout"
Repository = "https://github.com/ambientneon/assetout"
Issues = "https://github.com/ambientneon/assetout/issues"

[project.scripts]
assetout = "assetout.cli:app"

[tool.setuptools.packages.find]
where = ["src"]